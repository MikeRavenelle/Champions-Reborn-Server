services:
  champions:
    build: .
    restart: unless-stopped
    environment:
      PUBLIC_IP: ${PUBLIC_IP:?set PUBLIC_IP to the address clients connect to}
    ports:
      - "40800-40830:40800-40830"
      - "40900:40900"
      - "40910:40910"
      - "10101:10101/udp"
    volumes:
      - champions-data:/data
volumes:
  champions-data:
